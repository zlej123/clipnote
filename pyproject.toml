[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepkeeper"
version = "0.2.0"
description = "Turn how-to YouTube videos into follow-along documents with visual guides at ambiguous moments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2026.7.4",
    "reportlab>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/zlej123/stepkeeper"

[project.scripts]
stepkeeper = "stepkeeper.pipeline:main"
stepkeeper-analyze = "stepkeeper.analyze:main"
stepkeeper-capture = "stepkeeper.capture:main"
stepkeeper-render = "stepkeeper.render:main"
stepkeeper-export = "stepkeeper.export:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stepkeeper = ["skill-core/**/*"]
