name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # yt-dlp>=2026.7.4가 파이썬 3.10 이상 전용 — 3.9는 설치 단계에서 죽는다
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # playable() 테스트가 실제 ffmpeg로 한 프레임 디코드한다 — 없으면 skip되므로 명시 설치
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m compileall -q src/stepkeeper
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      # fixture 구조 검증(오프라인) — 코퍼스·validator가 어긋난 채 초록불이 되는 걸 막는다
      # (실측: en_output을 10편으로 늘릴 때 validator 범위를 빠뜨렸는데 CI가 잡지 못했다).
      # batch 실분석은 네트워크·키가 필요해 CI 밖 — 수동 실행이며 fail-closed다.
      - run: python tests/validate_fixtures.py
